name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm32
            task: assembleArm32Debug
            apk: BatteryOptimizer-arm32.apk
          - abi: arm64
            task: assembleArm64Debug
            apk: BatteryOptimizer-arm64.apk

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Find or extract the Android project
        run: |
          set -e
          FOUND=$(find . -name settings.gradle.kts -not -path './build-src/*' | head -n 1)

          if [ -z "$FOUND" ]; then
            # Pick the NEWEST ZIP (highest version number, so _10 beats _9) that contains the
            # latest code. Both ABI jobs use this same rule, so they always build the same code.
            # The marker below exists only in the newest build, not in the older zips.
            ZIP=""
            while IFS= read -r z; do
              if unzip -p "$z" '*MainActivity.kt' 2>/dev/null | grep -q 'ShizukuGrant.init'; then
                ZIP="$z"
                break
              fi
            done < <(find . -name 'BatteryOptimizer*.zip' | sort -V -r)

            if [ -z "$ZIP" ]; then
              ZIP=$(find . -name 'BatteryOptimizer*.zip' | sort -V -r | head -n 1)
              echo "::warning::No ZIP with the latest code found, using $ZIP"
            fi
            echo "Chosen ZIP for ${{ matrix.abi }}: $ZIP"

            if [ -n "$ZIP" ]; then
              echo "Using ZIP: $ZIP"
              mkdir -p build-src
              unzip -q "$ZIP" -d build-src
              FOUND=$(find build-src -name settings.gradle.kts | head -n 1)
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No settings.gradle.kts or BatteryOptimizer.zip found in the repo"
            find . -maxdepth 3 -not -path './.git*' | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show tool versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version

      - name: Build ${{ matrix.abi }} APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace ${{ matrix.task }} 2>&1 | tee "$GITHUB_WORKSPACE/build-output.txt"

      - name: Show compile errors in run summary
        if: failure()
        run: |
          if [ -f "$GITHUB_WORKSPACE/build-output.txt" ]; then
            grep -E "^e: |^> |What went wrong|error:|FAILURE" "$GITHUB_WORKSPACE/build-output.txt" | head -40 | while IFS= read -r line; do
              echo "::error title=Build error::$line"
            done
          else
            echo "::error::Gradle produced no output"
          fi

      - name: Collect and verify APK
        run: |
          SRC="$PROJECT_DIR/app/build/outputs/apk/${{ matrix.abi }}/debug/app-${{ matrix.abi }}-debug.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::APK not found at $SRC"
            find "$PROJECT_DIR/app/build/outputs" -name '*.apk' || true
            exit 1
          fi
          cp "$SRC" "${{ matrix.apk }}"
          ls -lh "${{ matrix.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.abi }}
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/
            build-output.txt
          if-no-files-found: ignore
